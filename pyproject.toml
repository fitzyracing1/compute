[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compute"
version = "0.1.0"
description = "A bounded weekly clock — an alternate to continuous Unix time."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "fitzyracing1" }]

[tool.setuptools.packages.find]
include = ["compute*"]
